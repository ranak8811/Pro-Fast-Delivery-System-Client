name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_apiKey: ${{ secrets.VITE_API_KEY || secrets.VITE_apiKey }}
          VITE_authDomain: ${{ secrets.VITE_AUTH_DOMAIN || secrets.VITE_authDomain }}
          VITE_projectId: ${{ secrets.VITE_PROJECT_ID || secrets.VITE_projectId }}
          VITE_storageBucket: ${{ secrets.VITE_STORAGE_BUCKET || secrets.VITE_storageBucket }}
          VITE_messagingSenderId: ${{ secrets.VITE_MESSAGING_SENDER_ID || secrets.VITE_messagingSenderId }}
          VITE_appId: ${{ secrets.VITE_APP_ID || secrets.VITE_appId }}
          VITE_payment_key: ${{ secrets.VITE_PAYMENT_KEY || secrets.VITE_payment_key }}
          VITE_imgbb_key: ${{ secrets.VITE_IMGBB_KEY || secrets.VITE_imgbb_key }}
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://pro-fast-delivery-system-server.vercel.app' }}
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZAP_SHIFT_ABEC3 }}
          channelId: live
          projectId: zap-shift-abec3
